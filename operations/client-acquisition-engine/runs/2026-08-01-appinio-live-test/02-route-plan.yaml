  - "Produce one-page transition map"
  - "Inspect branded PDF"
  - "Prepare email and LinkedIn drafts"
  - "Request outreach and CRM-write approval"
approval_gates:
  - "Approval before HubSpot or ClickUp writes"
  - "Approval before Gmail send or LinkedIn action"
